# ============================================================
# Secret de MySQL
# Los valores son placeholders en base64.
# El pipeline de GitHub Actions los sobreescribe con:
#   kubectl create secret generic mysql-secret \
#     --from-literal=MYSQL_ROOT_PASSWORD=... \
#     --from-literal=MYSQL_DATABASE=...     \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# NO subir este archivo con valores reales al repositorio.
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "PLACEHOLDER_reemplazado_por_pipeline"
  MYSQL_DATABASE: "PLACEHOLDER_reemplazado_por_pipeline"
