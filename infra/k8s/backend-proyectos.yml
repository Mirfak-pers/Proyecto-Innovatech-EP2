apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-proyectos
  labels:
    app: backend-proyectos
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-proyectos
  template:
    metadata:
      labels:
        app: backend-proyectos
        tier: backend
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: backend-proyectos
          image: backend-proyectos:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_ENDPOINT
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 8
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: backend-proyectos
  labels:
    app: backend-proyectos
    tier: backend
spec:
  selector:
    app: backend-proyectos
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
