name: EP3 - Build, Push ECR y Deploy EKS

on:
  push:
    branches:
      - deploy

concurrency:
  group: ep3-deploy-eks
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: innovatech-cluster
  PROJECT_NAME: innovatech-ep3

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir URLs de repositorios ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          echo "FRONTEND_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROJECT_NAME}-frontend" >> $GITHUB_ENV
          echo "VENTAS_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROJECT_NAME}-ventas-backend" >> $GITHUB_ENV
          echo "DESPACHOS_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROJECT_NAME}-despachos-backend" >> $GITHUB_ENV

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y Push - Backend Ventas
        uses: docker/build-push-action@v6
        with:
          context: ./back-Ventas_SpringBoot/Springboot-API-REST
          platforms: linux/amd64
          push: true
          tags: ${{ env.VENTAS_ECR }}:${{ github.sha }}

      - name: Build y Push - Backend Despachos
        uses: docker/build-push-action@v6
        with:
          context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          platforms: linux/amd64
          push: true
          tags: ${{ env.DESPACHOS_ECR }}:${{ github.sha }}

      - name: Build y Push - Frontend Despacho
        uses: docker/build-push-action@v6
        with:
          context: ./front_despacho
          platforms: linux/amd64
          push: true
          tags: ${{ env.FRONTEND_ECR }}:${{ github.sha }}

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      - name: Conectar kubectl al cluster EKS
        run: |
          aws eks update-kubeconfig             --region ${{ env.AWS_REGION }}             --name ${{ env.CLUSTER_NAME }}

      - name: Aplicar Secret de MySQL
        run: |
          kubectl create secret generic mysql-secret             --from-literal=MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}"             --from-literal=MYSQL_DATABASE="${{ secrets.MYSQL_DATABASE }}"             --dry-run=client -o yaml | kubectl apply -f -

      - name: Crear imagePullSecret para ECR
        run: |
          ECR_TOKEN=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          kubectl create secret docker-registry ecr-secret             --docker-server=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com             --docker-username=AWS             --docker-password=${ECR_TOKEN}             --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar manifiestos Kubernetes con imágenes versionadas por SHA
        run: |
          sed -i "s|image: backend-ventas:latest|image: ${{ env.VENTAS_ECR }}:${{ github.sha }}|g" infra/k8s/backend-ventas.yml
          sed -i "s|image: backend-despachos:latest|image: ${{ env.DESPACHOS_ECR }}:${{ github.sha }}|g" infra/k8s/backend-despachos.yml
          sed -i "s|image: frontend:latest|image: ${{ env.FRONTEND_ECR }}:${{ github.sha }}|g" infra/k8s/frontend.yml

          kubectl apply -f infra/k8s/mysql.yml
          kubectl apply -f infra/k8s/backend-ventas.yml
          kubectl apply -f infra/k8s/backend-despachos.yml
          kubectl apply -f infra/k8s/frontend.yml
          kubectl apply -f infra/k8s/hpa-backends.yml

      - name: Esperar rollout - MySQL
        continue-on-error: true
        run: |
          kubectl rollout status deployment/mysql --timeout=300s || true
          kubectl get pods
          kubectl logs deployment/mysql || true

      - name: Esperar rollout - Backend Ventas
        continue-on-error: true
        run: |
          kubectl rollout status deployment/backend-ventas --timeout=300s || true
          kubectl get pods
          kubectl logs deployment/backend-ventas || true

      - name: Esperar rollout - Backend Despachos
        continue-on-error: true
        run: |
          kubectl rollout status deployment/backend-despachos --timeout=300s || true
          kubectl get pods
          kubectl logs deployment/backend-despachos || true

      - name: Esperar rollout - Frontend
        continue-on-error: true
        run: |
          kubectl rollout status deployment/frontend --timeout=120s || true
          kubectl get pods
          kubectl logs deployment/frontend || true

      - name: Estado final del cluster
        run: |
          echo "====== PODS ======"
          kubectl get pods -o wide

          echo ""
          echo "====== SERVICES ======"
          kubectl get services

          echo ""
          echo "====== HPA ======"
          kubectl get hpa

          echo ""
          echo "====== URL PUBLICA DEL FRONTEND ======"
          kubectl get service frontend             -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
          echo ""
