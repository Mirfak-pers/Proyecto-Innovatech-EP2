name: EP3 - Build, Push ECR y Deploy EKS

on:
  push:
    branches:
      - deploy

concurrency:
  group: ep3-deploy-eks
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: innovatech-cluster
  PROJECT_NAME: innovatech-ep3

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Credenciales AWS (AWS Academy)
      # ----------------------------------------------------------
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # 3. Login ECR
      # ----------------------------------------------------------
      - name: Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------------------------
      # 4. Construir URLs de repositorios ECR
      # ----------------------------------------------------------
      - name: Construir URLs de repositorios ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "FRONTEND_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROJECT_NAME}-frontend" >> $GITHUB_ENV
          echo "PROYECTOS_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROJECT_NAME}-proyectos-backend" >> $GITHUB_ENV
          echo "AVANCES_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROJECT_NAME}-avances-backend" >> $GITHUB_ENV

      # ----------------------------------------------------------
      # 5. Build y Push de las 3 imágenes
      # ----------------------------------------------------------
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y Push - Backend Proyectos
        uses: docker/build-push-action@v6
        with:
          context: ./backend-proyectos
          platforms: linux/amd64
          push: true
          tags: ${{ env.PROYECTOS_ECR }}:${{ github.sha }}

      - name: Build y Push - Backend Avances
        uses: docker/build-push-action@v6
        with:
          context: ./backend-avances
          platforms: linux/amd64
          push: true
          tags: ${{ env.AVANCES_ECR }}:${{ github.sha }}

      - name: Build y Push - Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: ${{ env.FRONTEND_ECR }}:${{ github.sha }}

      # ----------------------------------------------------------
      # 6. Conectar kubectl al cluster EKS
      # ----------------------------------------------------------
      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      - name: Conectar kubectl al cluster EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.CLUSTER_NAME }}

      # ----------------------------------------------------------
      # 7. Crear Secret de MySQL (idempotente)
      # ----------------------------------------------------------
      - name: Aplicar Secret de MySQL
        run: |
          kubectl delete secret mysql-secret --ignore-not-found
          kubectl create secret generic mysql-secret \
            --from-literal=MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} \
            --from-literal=MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}

      # ----------------------------------------------------------
      # 8. Crear imagePullSecret para ECR
      #    Los nodos de AWS Academy no tienen acceso automático a ECR,
      #    por lo que cada pod necesita este secret para autenticarse.
      # ----------------------------------------------------------
      - name: Crear imagePullSecret para ECR
        run: |
          ECR_TOKEN=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          kubectl create secret docker-registry ecr-secret \
            --docker-server=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com \
            --docker-username=AWS \
            --docker-password=${ECR_TOKEN} \
            --dry-run=client -o yaml | kubectl apply -f -

      # ----------------------------------------------------------
      # 9. Aplicar manifiestos Kubernetes
      # ----------------------------------------------------------
      - name: Aplicar manifiestos Kubernetes
        run: |
          kubectl apply -f infra/k8s/mysql.yml
          kubectl apply -f infra/k8s/backend-proyectos.yml
          kubectl apply -f infra/k8s/backend-avances.yml
          kubectl apply -f infra/k8s/frontend.yml
          kubectl apply -f infra/k8s/hpa-backends.yml

      # ----------------------------------------------------------
      # 10. Actualizar imagen con el SHA del commit
      # ----------------------------------------------------------
      - name: Actualizar imagen - Backend Proyectos
        run: |
          kubectl set image deployment/backend-proyectos \
            backend-proyectos=${{ env.PROYECTOS_ECR }}:${{ github.sha }}

      - name: Actualizar imagen - Backend Avances
        run: |
          kubectl set image deployment/backend-avances \
            backend-avances=${{ env.AVANCES_ECR }}:${{ github.sha }}

      - name: Actualizar imagen - Frontend
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ env.FRONTEND_ECR }}:${{ github.sha }}

      # ----------------------------------------------------------
      # 11. Esperar rollout (continue-on-error para no cortar el pipeline
      #     si Spring Boot tarda más de lo esperado en arrancar)
      # ----------------------------------------------------------
      - name: Esperar rollout - Backend Proyectos
        continue-on-error: true
        run: kubectl rollout status deployment/backend-proyectos --timeout=300s

      - name: Esperar rollout - Backend Avances
        continue-on-error: true
        run: kubectl rollout status deployment/backend-avances --timeout=300s

      - name: Esperar rollout - Frontend
        continue-on-error: true
        run: kubectl rollout status deployment/frontend --timeout=120s

      # ----------------------------------------------------------
      # 12. Estado final del cluster
      # ----------------------------------------------------------
      - name: Estado final del cluster
        run: |
          echo "====== PODS ======"
          kubectl get pods -o wide

          echo ""
          echo "====== SERVICES ======"
          kubectl get services

          echo ""
          echo "====== HPA ======"
          kubectl get hpa

          echo ""
          echo "====== URL PUBLICA DEL FRONTEND ======"
          kubectl get service frontend \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
          echo ""
