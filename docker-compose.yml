services:
  mysql:
    image: mysql:8.0
    container_name: innovatech-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - innovatech-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend-ventas:
    build:
      context: ./back-Ventas_SpringBoot/Springboot-API-REST
    image: innovatech-ventas-backend:local
    container_name: innovatech-ventas-backend
    restart: unless-stopped
    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - innovatech-net

  backend-despachos:
    build:
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
    image: innovatech-despachos-backend:local
    container_name: innovatech-despachos-backend
    restart: unless-stopped
    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8081"
    networks:
      - innovatech-net

  frontend:
    build:
      context: ./front_despacho
    image: innovatech-front-despacho:local
    container_name: innovatech-front-despacho
    restart: unless-stopped
    environment:
      BACKEND_VENTAS_URL: ${BACKEND_VENTAS_URL:-http://backend-ventas:8080}
      BACKEND_DESPACHOS_URL: ${BACKEND_DESPACHOS_URL:-http://backend-despachos:8081}
    ports:
      - "3000:8080"
    depends_on:
      - backend-ventas
      - backend-despachos
    networks:
      - innovatech-net

volumes:
  mysql_data:
    name: innovatech_mysql_data

networks:
  innovatech-net:
    name: innovatech-net
    driver: bridge
